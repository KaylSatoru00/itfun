<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | Bookw</title>
    <style>
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        border: 0;
        overflow: hidden;
        background: #231F20;
      }
      /* Fill the iframe/viewport while Unity re-renders at the display size
         (matchWebGLToCanvasSize is on by default), so the game scales up in
         both the normal panel and fullscreen instead of staying 960x600. */
      #unity-canvas {
        display: block;
        width: 100%;
        height: 100%;
        background: #231F20;
      }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
    <script src="Build/module6.loader.js"></script>
    <script>
      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile: lock the viewport so the canvas fills the whole client area.
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);

        var canvas = document.querySelector("#unity-canvas");
        canvas.style.position = "fixed";
      }

      // ── Mute bridge ──────────────────────────────────────────────
      // The ITFun page (parent window) posts { type: "SET_MUTE", value }
      // when the speaker icon is clicked. We silence *all* Unity audio by
      // suspending its shared WebAudio context (and resume to unmute). A
      // statechange guard keeps it muted even if Unity resumes the context
      // on a user gesture.
      var unityInstanceRef = null;
      var desiredMuted = false;

      function itfunGetAudioContext() {
        try {
          return unityInstanceRef &&
                 unityInstanceRef.Module &&
                 unityInstanceRef.Module.WEBAudio &&
                 unityInstanceRef.Module.WEBAudio.audioContext || null;
        } catch (e) { return null; }
      }

      function itfunApplyMute() {
        var ctx = itfunGetAudioContext();
        if (!ctx) return;
        try {
          if (desiredMuted) {
            if (ctx.state === "running") ctx.suspend();
          } else {
            if (ctx.state === "suspended") ctx.resume();
          }
        } catch (e) {}
      }

      function itfunAttachGuard() {
        var ctx = itfunGetAudioContext();
        if (ctx && !ctx.__itfunGuard) {
          ctx.__itfunGuard = true;
          ctx.addEventListener("statechange", function () {
            if (desiredMuted && ctx.state === "running") {
              try { ctx.suspend(); } catch (e) {}
            }
          });
        }
      }

      window.addEventListener("message", function (e) {
        var d = e.data;
        if (d && d.type === "SET_MUTE") {
          desiredMuted = !!d.value;
          itfunApplyMute();
        }
      });

      createUnityInstance(document.querySelector("#unity-canvas"), {
        arguments: [],
        dataUrl: "Build/module6.data.br",
        frameworkUrl: "Build/module6.framework.js.br",
        codeUrl: "Build/module6.wasm.br",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Bookw",
        productVersion: "1.0",
        // matchWebGLToCanvasSize: false, // Uncomment this to separately control WebGL canvas render size and DOM element size.
        // devicePixelRatio: 1, // Uncomment this to override low DPI rendering on high DPI displays.
      }).then((unityInstance) => {
        unityInstanceRef = unityInstance;
        itfunAttachGuard();
        itfunApplyMute(); // honor a mute toggled before the game finished loading
      }).catch((message) => {
        alert(message);
      });
    </script>
  </body>
</html>
