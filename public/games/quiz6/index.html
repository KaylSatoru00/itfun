<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | Bookw</title>

    <!-- ── Audio capture (must run BEFORE the Unity loader) ──
         Wrap the AudioContext constructor so we get a reference to every
         context Unity creates, no matter where Unity stashes it. The ITFun
         page toggles mute via postMessage; we suspend/resume the captured
         contexts to silence / restore ALL game audio. -->
    <script>
      (function () {
        window.__itfunCtxs = [];
        window.__itfunMuted = false;
        var Native = window.AudioContext || window.webkitAudioContext;
        if (!Native) return;

        function reapply(ctx) {
          try {
            if (window.__itfunMuted) {
              if (ctx.state === "running") ctx.suspend();
            } else {
              if (ctx.state === "suspended") ctx.resume();
            }
          } catch (e) {}
        }

        function Patched() {
          var ctx = Reflect.construct(Native, arguments);
          window.__itfunCtxs.push(ctx);
          reapply(ctx);
          // If Unity resumes it (e.g. on a user gesture) while muted, re-mute.
          ctx.addEventListener("statechange", function () {
            if (window.__itfunMuted && ctx.state === "running") {
              try { ctx.suspend(); } catch (e) {}
            }
          });
          return ctx;
        }
        Patched.prototype = Native.prototype;
        window.AudioContext = Patched;
        window.webkitAudioContext = Patched;

        // Apply a mute state to every captured context.
        window.__itfunApplyMute = function () {
          window.__itfunCtxs.forEach(reapply);
        };
      })();
    </script>

    <style>
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        border: 0;
        overflow: hidden;
        background: #231F20;
      }
      /* Fill the iframe/viewport while Unity re-renders at the display size
         (matchWebGLToCanvasSize is on by default), so the game scales up in
         both the normal panel and fullscreen instead of staying 960x600. */
      #unity-canvas {
        display: block;
        width: 100%;
        height: 100%;
        background: #231F20;
      }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
    <script src="Build/module6.loader.js"></script>
    <script>
      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile: lock the viewport so the canvas fills the whole client area.
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);

        var canvas = document.querySelector("#unity-canvas");
        canvas.style.position = "fixed";
      }

      // The ITFun page posts { type: "SET_MUTE", value } when the speaker
      // icon is clicked. Flip the flag and apply it to every captured context.
      window.addEventListener("message", function (e) {
        var d = e.data;
        if (d && d.type === "SET_MUTE") {
          window.__itfunMuted = !!d.value;
          if (window.__itfunApplyMute) window.__itfunApplyMute();
        }
      });

      createUnityInstance(document.querySelector("#unity-canvas"), {
        arguments: [],
        dataUrl: "Build/module6.data.br",
        frameworkUrl: "Build/module6.framework.js.br",
        codeUrl: "Build/module6.wasm.br",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Bookw",
        productVersion: "1.0",
        // matchWebGLToCanvasSize: false, // Uncomment this to separately control WebGL canvas render size and DOM element size.
        // devicePixelRatio: 1, // Uncomment this to override low DPI rendering on high DPI displays.
      }).then((unityInstance) => {
        // Re-apply mute in case it was toggled before the game finished loading.
        if (window.__itfunApplyMute) window.__itfunApplyMute();
      }).catch((message) => {
        alert(message);
      });
    </script>
  </body>
</html>
